openapi: 3.0.3
info:
  title: Habit Tracker API
  version: 1.0.0
  description: API для управления полезными привычками и отправки напоминаний в Telegram.
paths:
  /api/habits/:
    get:
      operationId: habits_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - habits
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHabitList'
          description: ''
    post:
      operationId: habits_create
      tags:
      - habits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Habit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Habit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Habit'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
          description: ''
  /api/habits/{id}/:
    get:
      operationId: habits_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Привычка.
        required: true
      tags:
      - habits
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
          description: ''
    put:
      operationId: habits_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Привычка.
        required: true
      tags:
      - habits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Habit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Habit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Habit'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
          description: ''
    patch:
      operationId: habits_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Привычка.
        required: true
      tags:
      - habits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHabit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHabit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHabit'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
          description: ''
    delete:
      operationId: habits_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Привычка.
        required: true
      tags:
      - habits
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/habits/public/:
    get:
      operationId: habits_public_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - habits
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHabitList'
          description: ''
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/users/register/:
    post:
      operationId: users_register_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegister'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegister'
          description: ''
components:
  schemas:
    Habit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          title: Пользователь
        place:
          type: string
          title: Место
          maxLength: 255
        time:
          type: string
          format: time
          title: Время выполнения
        action:
          type: string
          title: Действие
          maxLength: 255
        is_pleasant:
          type: boolean
          title: Приятная привычка
        related_habit:
          type: integer
          nullable: true
          title: Связанная привычка
        periodicity:
          type: integer
          maximum: 7
          minimum: 1
          title: Периодичность в днях
        reward:
          type: string
          title: Вознаграждение
          maxLength: 255
        duration:
          type: integer
          maximum: 120
          minimum: 1
          title: Продолжительность в секундах
        is_public:
          type: boolean
          title: Публичная привычка
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата изменения
        last_reminder_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Последнее напоминание
      required:
      - action
      - created_at
      - duration
      - id
      - last_reminder_at
      - place
      - time
      - updated_at
      - user
    PaginatedHabitList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Habit'
    PatchedHabit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          title: Пользователь
        place:
          type: string
          title: Место
          maxLength: 255
        time:
          type: string
          format: time
          title: Время выполнения
        action:
          type: string
          title: Действие
          maxLength: 255
        is_pleasant:
          type: boolean
          title: Приятная привычка
        related_habit:
          type: integer
          nullable: true
          title: Связанная привычка
        periodicity:
          type: integer
          maximum: 7
          minimum: 1
          title: Периодичность в днях
        reward:
          type: string
          title: Вознаграждение
          maxLength: 255
        duration:
          type: integer
          maximum: 120
          minimum: 1
          title: Продолжительность в секундах
        is_public:
          type: boolean
          title: Публичная привычка
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата изменения
        last_reminder_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Последнее напоминание
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    UserRegister:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
      required:
      - email
      - id
      - password
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
