name: Habit Tracker CI

on:
  push:
    branches:
      - develop
      - main
      - feature/docker-deploy
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: habit_tracker_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d habit_tracker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SECRET_KEY: "ci-only-django-key-not-for-production"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_NAME: habit_tracker_ci
      DATABASE_USER: ci_user
      DATABASE_PASSWORD: ci_password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      TELEGRAM_BOT_TOKEN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: python -m pip install "poetry>=2.2,<3"

      - name: Install dependencies
        run: poetry install --with dev --no-root --no-interaction

      - name: Run tests
        run: poetry run python manage.py test

      - name: Run Ruff
        run: poetry run ruff check .

      - name: Build Docker image
        run: docker build -t habit-tracker:${{ github.sha }} .