[project]
name = "habit-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "dima"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django (>=6.1.1,<7.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "djangorestframework (>=3.18.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "celery[redis] (>=5.6.3,<6.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "coverage (>=7.16.1,<8.0.0)",
    "ruff (>=0.16.8,<0.17.0)"
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
